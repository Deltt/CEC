<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiger Prototyp</title>
<style>
/* ============ 1. DESIGN TOKENS (grey wireframe) ============ */
:root {
  --bg: #efefef; --surface: #fafafa; --line: #cfcfcf;
  --text: #2a2a2a; --muted: #777;
  --fill-strong: #4a4a4a; --fill-mid: #8e8e8e; --fill-soft: #d2d2d2;
  --interactive-bg: #dde6ee; --interactive-border: #a3b4c4; --interactive-accent: #5d7388;
  --radius: 12px; --gap: 14px; --anim-ms: 450ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181818; --surface: #232323; --line: #3b3b3b;
    --text: #e6e6e6; --muted: #9a9a9a;
    --fill-strong: #e0e0e0; --fill-mid: #8a8a8a; --fill-soft: #474747;
    --interactive-bg: #28323c; --interactive-border: #4b5c6d; --interactive-accent: #8ea6bc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181818; --surface: #232323; --line: #3b3b3b;
  --text: #e6e6e6; --muted: #9a9a9a;
  --fill-strong: #e0e0e0; --fill-mid: #8a8a8a; --fill-soft: #474747;
  --interactive-bg: #28323c; --interactive-border: #4b5c6d; --interactive-accent: #8ea6bc;
  color-scheme: dark;
}

/* ============ 2. BASE LAYOUT ============ */
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.app { max-width: 820px; margin: 0 auto; padding: 18px; display: grid; gap: var(--gap); }
.app-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
h1 { font-size: 1.35rem; margin: 0; font-weight: 650; }
h2 { font-size: 1rem; margin: 0 0 12px; font-weight: 650; }
.muted { color: var(--muted); font-size: .85rem; margin: 2px 0 0; }
.chip { border: 1px dashed var(--line); border-radius: 99px; padding: 3px 10px; font-size: .78rem; color: var(--muted); white-space: nowrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card.interactive { background: var(--interactive-bg); border-color: var(--interactive-border); }
.columns { display: grid; gap: var(--gap); grid-template-columns: 1fr; }

/* ============ 3. KPI ROW ============ */
.kpis { display: grid; gap: var(--gap); grid-template-columns: repeat(2, 1fr); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.kpi-label { color: var(--muted); font-size: .8rem; }
.kpi-value { font-size: 1.9rem; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi-unit { font-size: .9rem; color: var(--muted); margin-left: 3px; font-weight: 400; }

/* ============ 4. CONTROLS ============ */
.control { display: grid; gap: 6px; margin-bottom: 16px; }
.control-head { display: flex; justify-content: space-between; align-items: baseline; }
.control-value { font-variant-numeric: tabular-nums; font-weight: 600; }
input[type="range"] { width: 100%; height: 32px; accent-color: var(--interactive-accent); }
.switch-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.switch-row:last-child { padding-bottom: 0; }
.switch { position: relative; width: 52px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch-track { position: absolute; inset: 0; border-radius: 99px; background: var(--surface); border: 1px solid var(--interactive-border); transition: background var(--anim-ms); }
.switch-track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); transition: transform var(--anim-ms) cubic-bezier(.3,.8,.3,1); }
.switch input:checked + .switch-track { background: var(--interactive-accent); border-color: var(--interactive-accent); }
.switch input:checked + .switch-track::after { transform: translateX(22px); }
.switch input:focus-visible + .switch-track, input[type="range"]:focus-visible, .segment button:focus-visible { outline: 2px solid var(--fill-mid); outline-offset: 2px; }

/* ============ 5. STACKED BARS (annual mix) ============ */
.bar-block { margin-bottom: 18px; }
.bar-block:last-child { margin-bottom: 0; }
.bar-title { font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
.stack-bar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.stack-segment { height: 100%; flex-grow: 0; flex-basis: 0; transition: flex-grow var(--anim-ms) ease; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: .82rem; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--line); flex: none; }
.swatch.tick { height: 3px; border-radius: 0; border: 0; background: var(--text); }
.fill-1 { background: var(--fill-strong); }
.fill-2 { background: var(--fill-mid); }
.fill-3 { background: var(--fill-soft); }

/* ============ 6. DAY CHART ============ */
.chart-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.chart-head h2 { margin: 0; }
.segment { display: inline-flex; border: 1px solid var(--interactive-border); border-radius: 8px; overflow: hidden; }
.segment button { font: inherit; font-size: .85rem; padding: 6px 14px; border: 0; background: var(--interactive-bg); color: var(--text); cursor: pointer; transition: background var(--anim-ms); }
.segment button[aria-pressed="true"] { background: var(--fill-strong); color: var(--surface); }
.day-chart { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; height: 170px; margin-top: 10px; border-bottom: 1px solid var(--line); }
.day-column { position: relative; display: flex; flex-direction: column-reverse; height: 100%; }
.day-segment { width: 100%; height: 0; transition: height var(--anim-ms) ease; }
.day-tick { position: absolute; left: -1px; right: -1px; bottom: 0; height: 3px; background: var(--text); transition: bottom var(--anim-ms) ease; }
.hour-axis { display: flex; justify-content: space-between; color: var(--muted); font-size: .75rem; margin-top: 4px; }
.fine-print { font-size: .78rem; color: var(--muted); }

/* ============ 7. RESPONSIVE ============ */
@media (min-width: 600px) {
  .kpis { grid-template-columns: repeat(4, 1fr); }
  .columns { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  :root { --anim-ms: 0ms; }
}
</style>
</head>
<body>
<main class="app">
  <header class="app-header">
    <div>
      <h1>Customer Experience Center Prototyp</h1>
      <p class="muted" id="house-label"></p>
    </div>
    <span class="chip">Prototyp mit Platzhalterwerten</span>
  </header>

  <section class="kpis" aria-label="Ergebnisse">
    <div class="kpi"><div class="kpi-label">Autarkie</div><div class="kpi-value"><span data-kpi="autarkyPercent">0</span><span class="kpi-unit">%</span></div></div>
    <div class="kpi"><div class="kpi-label">Eigenverbrauch</div><div class="kpi-value"><span data-kpi="selfConsumptionPercent">0</span><span class="kpi-unit">%</span></div></div>
    <div class="kpi"><div class="kpi-label">Vorteil pro Jahr</div><div class="kpi-value"><span data-kpi="yearlyBenefitEur">0</span><span class="kpi-unit">€</span></div></div>
    <div class="kpi"><div class="kpi-label">Amortisation</div><div class="kpi-value"><span data-kpi="paybackYears">0</span><span class="kpi-unit" id="payback-unit">Jahre</span></div></div>
  </section>

  <div class="columns">
    <section class="card interactive" aria-label="Konfiguration">
      <h2>Konfiguration</h2>
      <div class="control">
        <div class="control-head"><label for="input-pv">PV-Leistung</label><span class="control-value" id="output-pv"></span></div>
        <input type="range" id="input-pv">
      </div>
      <div class="control">
        <div class="control-head"><label for="input-battery">Speicher</label><span class="control-value" id="output-battery"></span></div>
        <input type="range" id="input-battery">
      </div>
      <div class="switch-row"><span id="label-heat-pump">Wärmepumpe</span>
        <label class="switch"><input type="checkbox" id="input-heat-pump" aria-labelledby="label-heat-pump"><span class="switch-track"></span></label></div>
      <div class="switch-row"><span id="label-ev">Wallbox mit E-Auto</span>
        <label class="switch"><input type="checkbox" id="input-ev" aria-labelledby="label-ev"><span class="switch-track"></span></label></div>
    </section>

    <section class="card" aria-label="Jahresübersicht">
      <h2>Jahresübersicht</h2>
      <div class="bar-block" id="bar-consumption"></div>
      <div class="bar-block" id="bar-solar"></div>
    </section>
  </div>

  <section class="card" aria-label="Typischer Tag">
    <div class="chart-head">
      <h2>Typischer Tag</h2>
      <div class="segment" id="season-switch">
        <button type="button" data-season="summer" aria-pressed="true">Sommer</button>
        <button type="button" data-season="winter" aria-pressed="false">Winter</button>
      </div>
    </div>
    <div class="legend" id="day-legend"></div>
    <div class="day-chart" id="day-chart"></div>
    <div class="hour-axis"><span>0 Uhr</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
  </section>

  <p class="fine-print" id="assumptions"></p>
</main>

<script>
/* ============ A. CONFIG: values to adjust ============ */
const CONFIG = {
  HOUSE_LABEL: "Beispielhaus (Platzhalterdaten)",

  // Slider ranges and start values
  PV_KWP:      { min: 0, max: 20, step: 0.5, start: 8 },
  BATTERY_KWH: { min: 0, max: 20, step: 1,   start: 8 },
  HEAT_PUMP_START_ENABLED: false,
  EV_START_ENABLED: false,

  // Yearly consumption (kWh)
  HOUSEHOLD_KWH_PER_YEAR: 3500,
  HEAT_PUMP_KWH_PER_YEAR: 4000,
  EV_KWH_PER_YEAR: 2500,

  // Monthly shapes (index 0 = January)
  DAYS_PER_MONTH: [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31],
  PV_KWH_PER_KWP_BY_MONTH: [25, 50, 90, 125, 145, 150, 150, 130, 95, 60, 30, 20],
  HEAT_PUMP_SHARE_BY_MONTH: [0.19, 0.16, 0.13, 0.08, 0.04, 0.02, 0.01, 0.01, 0.03, 0.08, 0.12, 0.13],
  SEASON_MONTH_INDEX: { summer: 6, winter: 0 },

  // Battery model
  BATTERY_ROUNDTRIP_EFFICIENCY: 0.92,
  BATTERY_MAX_POWER_KW_PER_KWH: 0.5,
  BATTERY_RESERVE_SHARE: 0.1,

  // Prices and costs (EUR)
  ELECTRICITY_PRICE_EUR_PER_KWH: 0.35,
  FEED_IN_TARIFF_EUR_PER_KWH: 0.08,
  COST_PV_EUR_PER_KWP: 1400,
  COST_BATTERY_EUR_PER_KWH: 700,
  COST_HEAT_PUMP_EUR: 14000,
  COST_WALLBOX_EUR: 1500,
  HEAT_PUMP_SAVING_VS_OLD_HEATING_EUR_PER_YEAR: 700,
  MAX_PAYBACK_YEARS_SHOWN: 30,

  // UI texts
  LABELS: {
    consumptionBar: "Woher kommt der Strom im Haus?",
    consumptionParts: ["Direkt aus Solar", "Aus Speicher", "Aus Netz"],
    solarBar: "Wohin geht der Solarstrom?",
    solarParts: ["Direkt genutzt", "In Speicher", "Ins Netz"],
    dayParts: ["Direkt aus Solar", "Aus Speicher", "Aus Netz"],
    dayProduction: "Solarerzeugung",
  },
};

/* ============ B. STATE ============ */
const state = {
  pvKwp: CONFIG.PV_KWP.start,
  batteryKwh: CONFIG.BATTERY_KWH.start,
  heatPumpEnabled: CONFIG.HEAT_PUMP_START_ENABLED,
  evEnabled: CONFIG.EV_START_ENABLED,
  season: "summer",
};

/* ============ C. HOURLY PROFILES (replace with PV*SOL CSV data later) ============ */
const HOURS = Array.from({ length: 24 }, (_, hour) => hour);

function normalizeToSumOne(values) {
  const total = values.reduce((sum, value) => sum + value, 0);
  return values.map((value) => (total === 0 ? 0 : value / total));
}

function gaussian(hour, centerHour, width) {
  return Math.exp(-((hour + 0.5 - centerHour) ** 2) / (2 * width ** 2));
}

function buildSolarShape(monthIndex) {
  const daylightWidth = 2.4 + 1.2 * (1 - Math.abs(monthIndex - 5.5) / 5.5);
  return normalizeToSumOne(HOURS.map((hour) => gaussian(hour, 13, daylightWidth)));
}

function buildHouseholdShape() {
  return normalizeToSumOne(HOURS.map((hour) => 0.3 + 1.2 * gaussian(hour, 7.5, 1.2) + 1.6 * gaussian(hour, 19, 2)));
}

function buildHeatPumpShape() {
  return normalizeToSumOne(HOURS.map((hour) => 1 + 0.3 * gaussian(hour, 6, 2) + 0.3 * gaussian(hour, 19, 2)));
}

function buildEvShape() {
  return normalizeToSumOne(HOURS.map((hour) => (hour >= 18 && hour <= 22 ? 1 : 0)));
}

function buildHourlyProfiles(monthIndex) {
  const days = CONFIG.DAYS_PER_MONTH[monthIndex];
  const solarKwhPerDay = (state.pvKwp * CONFIG.PV_KWH_PER_KWP_BY_MONTH[monthIndex]) / days;
  const solarKwh = buildSolarShape(monthIndex).map((share) => share * solarKwhPerDay);

  const householdShape = buildHouseholdShape();
  const heatPumpShape = buildHeatPumpShape();
  const evShape = buildEvShape();
  const heatPumpKwhPerDay = (CONFIG.HEAT_PUMP_KWH_PER_YEAR * CONFIG.HEAT_PUMP_SHARE_BY_MONTH[monthIndex]) / days;

  const loadKwh = HOURS.map((hour) => {
    let load = (CONFIG.HOUSEHOLD_KWH_PER_YEAR / 365) * householdShape[hour];
    if (state.heatPumpEnabled) load += heatPumpKwhPerDay * heatPumpShape[hour];
    if (state.evEnabled) load += (CONFIG.EV_KWH_PER_YEAR / 365) * evShape[hour];
    return load;
  });
  return { solarKwh, loadKwh };
}

/* ============ D. SIMULATION ============ */
function simulateDay(solarKwh, loadKwh, startEnergyKwh) {
  const capacityKwh = state.batteryKwh;
  const maxPowerKwh = capacityKwh * CONFIG.BATTERY_MAX_POWER_KW_PER_KWH;
  const reserveKwh = capacityKwh * CONFIG.BATTERY_RESERVE_SHARE;
  const oneWayEfficiency = Math.sqrt(CONFIG.BATTERY_ROUNDTRIP_EFFICIENCY);
  const day = { direct: [], fromBattery: [], fromGrid: [], toBattery: [], feedIn: [] };
  let energyKwh = startEnergyKwh;

  HOURS.forEach((hour) => {
    const direct = Math.min(solarKwh[hour], loadKwh[hour]);
    const surplus = solarKwh[hour] - direct;
    const deficit = loadKwh[hour] - direct;

    const charged = Math.min(surplus, maxPowerKwh, (capacityKwh - energyKwh) / oneWayEfficiency);
    energyKwh += charged * oneWayEfficiency;

    const available = Math.max(0, energyKwh - reserveKwh) * oneWayEfficiency;
    const delivered = Math.min(deficit, maxPowerKwh, available);
    energyKwh -= delivered / oneWayEfficiency;

    day.direct.push(direct);
    day.toBattery.push(charged);
    day.feedIn.push(surplus - charged);
    day.fromBattery.push(delivered);
    day.fromGrid.push(deficit - delivered);
  });
  return { day, endEnergyKwh: energyKwh };
}

function sumList(values) {
  return values.reduce((sum, value) => sum + value, 0);
}

function simulateYear() {
  const totals = { consumption: 0, production: 0, direct: 0, fromBattery: 0, fromGrid: 0, toBattery: 0, feedIn: 0 };
  const typicalDays = {};

  CONFIG.DAYS_PER_MONTH.forEach((days, monthIndex) => {
    const { solarKwh, loadKwh } = buildHourlyProfiles(monthIndex);
    const warmUp = simulateDay(solarKwh, loadKwh, state.batteryKwh * 0.5);
    const { day } = simulateDay(solarKwh, loadKwh, warmUp.endEnergyKwh);

    totals.consumption += sumList(loadKwh) * days;
    totals.production += sumList(solarKwh) * days;
    ["direct", "fromBattery", "fromGrid", "toBattery", "feedIn"].forEach((key) => {
      totals[key] += sumList(day[key]) * days;
    });
    typicalDays[monthIndex] = { day, solarKwh, loadKwh };
  });
  return { totals, typicalDays };
}

/* ============ E. METRICS ============ */
function calculateInvestmentEur() {
  let investment = state.pvKwp * CONFIG.COST_PV_EUR_PER_KWP + state.batteryKwh * CONFIG.COST_BATTERY_EUR_PER_KWH;
  if (state.heatPumpEnabled) investment += CONFIG.COST_HEAT_PUMP_EUR;
  if (state.evEnabled) investment += CONFIG.COST_WALLBOX_EUR;
  return investment;
}

function calculateMetrics(totals) {
  const coveredLocally = totals.direct + totals.fromBattery;
  const billWithoutSolar = totals.consumption * CONFIG.ELECTRICITY_PRICE_EUR_PER_KWH;
  const billWithSolar = totals.fromGrid * CONFIG.ELECTRICITY_PRICE_EUR_PER_KWH - totals.feedIn * CONFIG.FEED_IN_TARIFF_EUR_PER_KWH;
  let yearlyBenefitEur = billWithoutSolar - billWithSolar;
  if (state.heatPumpEnabled) yearlyBenefitEur += CONFIG.HEAT_PUMP_SAVING_VS_OLD_HEATING_EUR_PER_YEAR;

  const investmentEur = calculateInvestmentEur();
  const paybackYears = yearlyBenefitEur > 0 && investmentEur > 0 ? investmentEur / yearlyBenefitEur : null;
  return {
    autarkyPercent: totals.consumption > 0 ? (coveredLocally / totals.consumption) * 100 : 0,
    selfConsumptionPercent: totals.production > 0 ? ((totals.production - totals.feedIn) / totals.production) * 100 : 0,
    yearlyBenefitEur,
    paybackYears,
  };
}

/* ============ F. RENDERING ============ */
const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const numberFormat = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 1 });
const integerFormat = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 0 });

function animateNumber(element, targetValue, { decimals = 0, durationMs = 500 } = {}) {
  const startValue = Number(element.dataset.value || 0);
  const format = decimals > 0 ? numberFormat : integerFormat;
  element.dataset.value = targetValue;
  if (prefersReducedMotion) { element.textContent = format.format(targetValue); return; }
  const startTime = performance.now();
  function step(now) {
    const progress = Math.min(1, (now - startTime) / durationMs);
    const eased = 1 - (1 - progress) ** 3;
    element.textContent = format.format(startValue + (targetValue - startValue) * eased);
    if (progress < 1 && Number(element.dataset.value) === targetValue) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderKpis(metrics) {
  const kpiElement = (name) => document.querySelector(`[data-kpi="${name}"]`);
  animateNumber(kpiElement("autarkyPercent"), metrics.autarkyPercent);
  animateNumber(kpiElement("selfConsumptionPercent"), metrics.selfConsumptionPercent);
  animateNumber(kpiElement("yearlyBenefitEur"), Math.round(metrics.yearlyBenefitEur));

  const paybackElement = kpiElement("paybackYears");
  const paybackUnit = document.getElementById("payback-unit");
  const years = metrics.paybackYears;
  if (years === null) {
    paybackElement.dataset.value = 0;
    paybackElement.textContent = "–";
    paybackUnit.textContent = "";
  } else if (years > CONFIG.MAX_PAYBACK_YEARS_SHOWN) {
    paybackElement.dataset.value = 0;
    paybackElement.textContent = `> ${CONFIG.MAX_PAYBACK_YEARS_SHOWN}`;
    paybackUnit.textContent = "Jahre";
  } else {
    animateNumber(paybackElement, years, { decimals: 1 });
    paybackUnit.textContent = "Jahre";
  }
}

function createLegendItem(label, swatchClass) {
  const item = document.createElement("span");
  item.className = "legend-item";
  item.innerHTML = `<span class="swatch ${swatchClass}"></span><span class="legend-label"></span>`;
  item.querySelector(".legend-label").textContent = label;
  return item;
}

function createStackedBar(container, title, partLabels) {
  const fillClasses = ["fill-1", "fill-2", "fill-3"];
  container.innerHTML = `<div class="bar-title"></div><div class="stack-bar"></div><div class="legend"></div>`;
  container.querySelector(".bar-title").textContent = title;
  const barElement = container.querySelector(".stack-bar");
  const legendElement = container.querySelector(".legend");
  const segments = partLabels.map((label, index) => {
    const segment = document.createElement("div");
    segment.className = `stack-segment ${fillClasses[index]}`;
    barElement.appendChild(segment);
    legendElement.appendChild(createLegendItem(label, fillClasses[index]));
    return segment;
  });
  const legendLabels = legendElement.querySelectorAll(".legend-label");

  return function updateStackedBar(values) {
    const total = sumList(values) || 1;
    values.forEach((value, index) => {
      segments[index].style.flexGrow = value / total;
      legendLabels[index].textContent = `${partLabels[index]} ${integerFormat.format((value / total) * 100)} %`;
    });
  };
}

function createDayChart(container) {
  const fillClasses = ["fill-1", "fill-2", "fill-3"];
  const columns = HOURS.map(() => {
    const column = document.createElement("div");
    column.className = "day-column";
    const segments = fillClasses.map((fillClass) => {
      const segment = document.createElement("div");
      segment.className = `day-segment ${fillClass}`;
      column.appendChild(segment);
      return segment;
    });
    const tick = document.createElement("div");
    tick.className = "day-tick";
    column.appendChild(tick);
    container.appendChild(column);
    return { segments, tick };
  });

  return function updateDayChart({ day, solarKwh, loadKwh }) {
    const maxKwh = Math.max(...solarKwh, ...loadKwh, 0.01) * 1.08;
    const toPercent = (kwh) => `${(kwh / maxKwh) * 100}%`;
    columns.forEach((column, hour) => {
      column.segments[0].style.height = toPercent(day.direct[hour]);
      column.segments[1].style.height = toPercent(day.fromBattery[hour]);
      column.segments[2].style.height = toPercent(day.fromGrid[hour]);
      column.tick.style.bottom = toPercent(solarKwh[hour]);
    });
  };
}

function renderConfigLabels() {
  document.getElementById("output-pv").textContent = `${numberFormat.format(state.pvKwp)} kWp`;
  document.getElementById("output-battery").textContent = state.batteryKwh === 0 ? "kein Speicher" : `${numberFormat.format(state.batteryKwh)} kWh`;
}

/* ============ G. APP WIRING ============ */
let updateConsumptionBar, updateSolarBar, updateDayChart;

function renderAll() {
  const { totals, typicalDays } = simulateYear();
  renderKpis(calculateMetrics(totals));
  updateConsumptionBar([totals.direct, totals.fromBattery, totals.fromGrid]);
  updateSolarBar([totals.direct, totals.toBattery, totals.feedIn]);
  updateDayChart(typicalDays[CONFIG.SEASON_MONTH_INDEX[state.season]]);
  renderConfigLabels();
}

function setupSlider(inputId, range, stateKey) {
  const input = document.getElementById(inputId);
  Object.assign(input, { min: range.min, max: range.max, step: range.step, value: state[stateKey] });
  input.addEventListener("input", () => {
    state[stateKey] = Number(input.value);
    renderAll();
  });
}

function setupSwitch(inputId, stateKey) {
  const input = document.getElementById(inputId);
  input.checked = state[stateKey];
  input.addEventListener("change", () => {
    state[stateKey] = input.checked;
    renderAll();
  });
}

function setupSeasonSwitch() {
  const buttons = document.querySelectorAll("#season-switch button");
  buttons.forEach((button) => {
    button.addEventListener("click", () => {
      state.season = button.dataset.season;
      buttons.forEach((other) => other.setAttribute("aria-pressed", String(other === button)));
      renderAll();
    });
  });
}

function setupStaticTexts() {
  document.getElementById("house-label").textContent = CONFIG.HOUSE_LABEL;
  document.getElementById("assumptions").textContent =
    `Annahmen: Strompreis ${numberFormat.format(CONFIG.ELECTRICITY_PRICE_EUR_PER_KWH * 100)} ct/kWh, Einspeisevergütung ${numberFormat.format(CONFIG.FEED_IN_TARIFF_EUR_PER_KWH * 100)} ct/kWh, synthetische Tagesprofile je Monat. Alle Werte sind Platzhalter und werden später durch die Hausdaten ersetzt.`;
  const legend = document.getElementById("day-legend");
  CONFIG.LABELS.dayParts.forEach((label, index) => legend.appendChild(createLegendItem(label, ["fill-1", "fill-2", "fill-3"][index])));
  legend.appendChild(createLegendItem(CONFIG.LABELS.dayProduction, "tick"));
}

function init() {
  setupStaticTexts();
  updateConsumptionBar = createStackedBar(document.getElementById("bar-consumption"), CONFIG.LABELS.consumptionBar, CONFIG.LABELS.consumptionParts);
  updateSolarBar = createStackedBar(document.getElementById("bar-solar"), CONFIG.LABELS.solarBar, CONFIG.LABELS.solarParts);
  updateDayChart = createDayChart(document.getElementById("day-chart"));
  setupSlider("input-pv", CONFIG.PV_KWP, "pvKwp");
  setupSlider("input-battery", CONFIG.BATTERY_KWH, "batteryKwh");
  setupSwitch("input-heat-pump", "heatPumpEnabled");
  setupSwitch("input-ev", "evEnabled");
  setupSeasonSwitch();
  requestAnimationFrame(renderAll);
}

init();
</script>
</body>
</html>
